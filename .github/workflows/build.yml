name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Bundle with ncc
        run: npm run bundle

      - name: Verify dist is up to date
        run: |
          if [ -n "$(git diff --name-only dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run bundle' and commit."
            git diff --stat dist/
            exit 1
          fi

  container-cache-dir:
    # kunobi-ninja/kache#835: in a container job HOME is /github/home, a bind
    # mount separate from the workspace, so the default cache dir cannot
    # hardlink into target/. The action must move the cache under RUNNER_TEMP,
    # and cached rlibs must then share inodes with the build tree.
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    env:
      FIXTURE: test/fixtures/cross-cc
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          github-cache: false
          save-cache: false
          pr-comment: false
          job-summary: false

      - name: The cache dir is under RUNNER_TEMP
        run: |
          echo "HOME=$HOME KACHE_CACHE_DIR=$KACHE_CACHE_DIR RUNNER_TEMP=$RUNNER_TEMP"
          case "$KACHE_CACHE_DIR" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error::KACHE_CACHE_DIR is not under RUNNER_TEMP"; exit 1 ;;
          esac

      - name: Build, then rebuild from a clean target
        run: |
          cargo build --manifest-path "$FIXTURE/Cargo.toml"
          rm -rf "$FIXTURE/target"
          cargo build --manifest-path "$FIXTURE/Cargo.toml"

      - name: Cached rlibs are hardlinked into target/
        run: |
          linked=$(find "$KACHE_CACHE_DIR" -type f -links +1 | wc -l)
          echo "store files with more than one link: $linked"
          if [ "$linked" -eq 0 ]; then
            echo "::error::no store file shares an inode with target/"
            exit 1
          fi

  cross-compile:
    # kunobi-ninja/kache#823: a bare CC export sent riscv64 C compiles to the
    # host gcc. With cache-c-cpp, the cc crate must pick the cross compiler,
    # compile through kache, and come from the cache on a rebuild.
    runs-on: ubuntu-latest
    env:
      TARGET: riscv64gc-unknown-linux-gnu
      FIXTURE: test/fixtures/cross-cc
    steps:
      - uses: actions/checkout@v4

      - name: Install the riscv64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu
          rustup target add "$TARGET"

      - uses: ./
        with:
          cache-c-cpp: true
          github-cache: false
          save-cache: false
          pr-comment: false
          job-summary: false

      - name: Build for riscv64
        run: cargo build --target "$TARGET" --manifest-path "$FIXTURE/Cargo.toml"

      - name: The C object is RISC-V and compiled through kache
        run: |
          obj=$(find "$FIXTURE/target/$TARGET" -name '*answer.o' | head -n 1)
          if [ -z "$obj" ]; then
            echo "::error::no answer.o under $FIXTURE/target/$TARGET"
            exit 1
          fi
          readelf -h "$obj" | grep 'Machine:'
          if ! readelf -h "$obj" | grep -q 'RISC-V'; then
            echo "::error::$obj is not a RISC-V object; the host compiler was used"
            exit 1
          fi
          log="${KACHE_RUNTIME_DIR:-$KACHE_CACHE_DIR}/events.jsonl"
          results=$(jq -r 'select(.crate_name == "answer.c") | .result' "$log" | tr '\n' ' ')
          echo "answer.c events: $results"
          case "$results" in
            *miss*) ;;
            *) echo "::error::answer.c did not compile through kache"; exit 1 ;;
          esac

      - name: Rebuild for riscv64 from a clean target
        run: |
          echo "EVENTS_BEFORE_REBUILD=$(wc -l < "${KACHE_RUNTIME_DIR:-$KACHE_CACHE_DIR}/events.jsonl")" >> "$GITHUB_ENV"
          rm -rf "$FIXTURE/target"
          cargo build --target "$TARGET" --manifest-path "$FIXTURE/Cargo.toml"

      # Kache either restores the fixture's whole build-script run, so cc does
      # not run at all, or cc runs and answer.c hits the C cache. Either way the
      # rebuild must not compile answer.c again.
      - name: The rebuilt C object came from the cache
        run: |
          obj=$(find "$FIXTURE/target/$TARGET" -name '*answer.o' | head -n 1)
          if [ -z "$obj" ] || ! readelf -h "$obj" | grep -q 'RISC-V'; then
            echo "::error::the rebuild did not restore a RISC-V answer.o"
            exit 1
          fi
          log="${KACHE_RUNTIME_DIR:-$KACHE_CACHE_DIR}/events.jsonl"
          results=$(tail -n "+$((EVENTS_BEFORE_REBUILD + 1))" "$log" \
            | jq -r 'select(.crate_name == "answer.c" or .crate_name == "build_script_run") | "\(.crate_name)=\(.result)"' \
            | tr '\n' ' ')
          echo "rebuild events: $results"
          case "$results" in
            *answer.c=miss*) echo "::error::the rebuild compiled answer.c again"; exit 1 ;;
            *answer.c=local_hit*|*build_script_run=local_hit*) ;;
            *) echo "::error::the rebuild did not take answer.c from the cache"; exit 1 ;;
          esac
