name: "Kache - Rust Build Cache"
description: "Content-addressed Rust build cache with S3 remote storage"
author: "Zondax"

inputs:
  version:
    description: "Kache version to install (default: latest)"
    required: false
  s3-bucket:
    description: "S3 bucket name for remote cache"
    required: false
  s3-region:
    description: "S3 region"
    required: false
    default: "us-east-1"
  s3-prefix:
    description: "S3 key prefix"
    required: false
    default: "artifacts"
  s3-endpoint:
    description: "Custom S3 endpoint (MinIO, R2, etc.)"
    required: false
  s3-access-key-id:
    description: "S3 access key ID"
    required: false
  s3-secret-access-key:
    description: "S3 secret access key"
    required: false
  cache-executables:
    description: "Cache bin/dylib/proc-macro outputs"
    required: false
    default: "false"
  github-cache:
    description: "Use GitHub Actions cache for the local kache store (used when S3 is not configured)"
    required: false
    default: "true"
  save-cache:
    description: "Save cache changes after the build. Set false for restore-only jobs. With S3, this also disables remote uploads."
    required: false
    default: "true"
  cache-key-prefix:
    description: "Custom prefix for GitHub Actions cache key"
    required: false
    default: "kache"
  sync:
    description: "Pull ALL remote cache on setup (slow, prefer warm)"
    required: false
    default: "false"
  warm:
    description: "Auto-prefetch expensive artifacts from build manifest on daemon startup"
    required: false
    default: "true"
  manifest-key:
    description: "Manifest key for scoping builds (default: target triple). Use different keys for clippy, test, release builds sharing the same S3 bucket."
    required: false
    default: ""
  namespace:
    description: "Enables content-addressed shards (sharded prefetch + shard upload). Defaults to manifest-key, so scoping a build turns shards on. Helps most when deps churn or for cross-branch sharing; set distinct values per build variant sharing one bucket, or leave both empty to disable shards. See the Manifest vs shards section in the README."
    required: false
    default: ""
  min-compile-ms:
    description: "Skip prefetching crates that compiled faster than this (ms). Cheaper to recompile."
    required: false
    default: "1000"
  token:
    description: "GitHub token for releases API and PR comments (needs pull-requests: write for comments)"
    required: false
    default: ${{ github.token }}
  pr-comment:
    description: "Post/update a sticky PR comment with cache stats."
    required: false
    default: "true"
  job-summary:
    description: "Write cache stats to the GitHub Actions job summary."
    required: false
    default: "true"
  max-size:
    description: 'Max local kache store size before LRU eviction (e.g. "100GiB"). Maps to KACHE_MAX_SIZE; kache defaults to 50GiB. Controls the local store, not a remote/S3 cap.'
    required: false

runs:
  using: "node24"
  main: "dist/setup/index.js"
  post: "dist/save/index.js"
  post-if: "success() || failure()"

branding:
  icon: "zap"
  color: "orange"
